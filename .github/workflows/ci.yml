name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t geo-measure-api .
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 geo-measure-api
          for _ in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -F file=@samples/hyderabad_survey.kml localhost:8000/api/files/
